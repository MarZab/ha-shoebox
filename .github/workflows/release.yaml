name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        run: tools/scripts/release_channel.sh "$GITHUB_REF_NAME" > channel
      - name: Release notes from CHANGELOG.md
        run: python3 tools/scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # the version's CHANGELOG section first, then GitHub's generated list of changes
        run: |
          notes=()
          if [ -s notes.md ]; then notes=(--notes-file notes.md); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${notes[@]}" "--$(cat channel)"
