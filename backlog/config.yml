project_name: "ha-shoebox"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: ["tooling", "integration", "panel", "tests", "docs", "release"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
definition_of_done: ["`mise run check` passes", "New or changed behaviour is covered by tests", "README and AGENTS.md match the change"]
