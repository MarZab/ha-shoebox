# Paths start with the media folder's name, e.g. "local/Family/beach.jpg" ("local" is My media).
# Patterns are globs over those paths ("*" within a folder, "**" at any depth, "?", "[...]") or
# "re:<regular expression>".
list:
  fields:
    pattern:
      default: "**"
      example: "local/Family/**"
      selector:
        text:
    type:
      default: all
      selector:
        select:
          translation_key: type
          options: [all, image, file, folder]
create_folder:
  fields:
    path:
      required: true
      example: local/Family/2025 Summer
      selector:
        text:
move:
  fields:
    path:
      required: true
      example: local/Phone/IMG_0001.heic
      selector:
        text:
    to:
      required: true
      example: local/Family
      selector:
        text:
rename:
  fields:
    path:
      required: true
      example: local/Phone/IMG_0001.heic
      selector:
        text:
    name:
      required: true
      example: beach.heic
      selector:
        text:
delete:
  fields:
    path:
      required: true
      example: local/Phone/IMG_0001.heic
      selector:
        text:
rotate:
  fields:
    path:
      required: true
      example: local/Family/beach.jpg
      selector:
        text:
    by:
      example: 90
      selector:
        select:
          translation_key: by
          options: ["90", "180", "270"]
    orientation:
      selector:
        number:
          min: 1
          max: 8
          mode: box
crop:
  fields:
    path:
      required: true
      example: local/Family/beach.jpg
      selector:
        text:
    left: &fraction
      selector:
        number:
          min: 0
          max: 1
          step: 0.001
          mode: box
    top: *fraction
    right: *fraction
    bottom: *fraction
    clear:
      default: false
      selector:
        boolean:
