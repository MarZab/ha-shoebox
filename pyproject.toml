# Developer tooling for the Shoebox Home Assistant integration.
# The integration in custom_components/shoebox ships through HACS; nothing here is published.

[project]
name = "shoebox"
version = "0.0.0"
description = "Shoebox: media manager and picture organizer for Home Assistant"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  # Pins homeassistant (and pytest) to the versions the tests run on.
  "pytest-homeassistant-custom-component==0.13.375",
  "pillow-heif==1.8.1",
  # What the frontend integration of that Home Assistant requires; the panel tests load it.
  "home-assistant-frontend==20260930.5",
  "mypy>=1.18",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["custom_components/shoebox"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/shoebox"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Home Assistant re-exports names from its packages without listing them in __all__.
module = ["homeassistant.*"]
implicit_reexport = true
