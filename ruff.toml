target-version = "py314"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "T20", "LOG", "G"]

[lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[lint.per-file-ignores]
# Tests check files directly, also inside async tests
"tests/**" = ["ASYNC240"]
# Command-line scripts print their output
"tools/scripts/**" = ["T20"]
